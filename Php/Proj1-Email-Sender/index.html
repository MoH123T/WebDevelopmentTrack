<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send a message</title>
  </head>
  <body>
    <main>
      <h1>Send a message</h1>
      <p id="success" hidden>Your message was sent successfully.</p>
      <form action="email.php" method="post">
        <p><label for="name">Name</label><br /><input id="name" name="name" autocomplete="name" required /></p>
        <p><label for="email">Email</label><br /><input id="email" name="email" type="email" autocomplete="email" required /></p>
        <p><label for="message">Message</label><br /><textarea id="message" name="message" rows="7" required></textarea></p>
        <button type="submit">Send message</button>
      </form>
    </main>
    <script>if (new URLSearchParams(window.location.search).has('sent')) document.querySelector('#success').hidden = false;</script>
  </body>
</html>
