<!DOCTYPE html>
<html>
<!--Form validition , checking input entered by user-->
<!-- Its gonna be fronted validition-->
<!-- Validtion inside the browser-->
<!-- This way is insecure and isnt production worthy its just for learning here-->
<!-- Get method shows info in browser-->

<!--
event is an object containing information about the event that happened.
HERE : The event is the form submission.

event.preventDefault() : the browser's default behavior is to submit the form and reload/navigate the page.
HERE : lets JavaScript handle the form instead.

.test() : method of a Regular Expression. , returns a Boolean:
HERE : checks whether emailAddress matches the regex.

.val() in jQuery is used to get or set the value of a form element.

-->
<head>

<title>Learning jQuery</title>
    <meta charset="UTF-8">
    <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content=" width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>



<style>
#wrapper {
width:600px;
margin:0 auto;
font-family:helvetica;
font-size:1.2em;
}

input {
width:300px;
height:40px;
padding:5px;
border-radius:5px;
font-size:1.2em;
border: 1px solid grey;
margin-bottom: 10px;
}

label {
width:200px;
float: left;
padding-top:7px;
}

#submitButton {
height:50px;
margin-left:200px;
width:100px;
}

#error {
color:red;
margin:20px;
}

</style>
</head>

<body>

 <div id="wrapper">
<div id="error"></div>

<form id="validationForm">

<label for="email">Email</label>
<input name="email" id="email" />

<label for="phone">Telephone</label>
<input name="phone" id="phone" />

<label for="pass">Password</label>
<input name="pass" type="password" id="pass1"/>

<label for="pass">Confirm Password</label>
<input name="pass" type="password" id="pass2"/>

<input id="submitButton" type="submit" value="Submit" />

</form>
</div>

<script>
$("#validationForm").submit(function(event) {

var errorMessage="";

event.preventDefault();

function isValidEmailAddress(emailAddress) {
   var pattern = new RegExp(
            /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
        );

return pattern.test(emailAddress);
};


if (!isValidEmailAddress($("#email").val())) {

errorMessage="Please enter a valid email address";

}
if (!$.isNumeric($("#phone").val())) {

errorMessage= errorMessage+ "<br>Please enter a valid phone number";
}

if ($("#pass1").val() != $("#pass2").val()) {

errorMessage= errorMessage +"<br />Please enter matching password";
}

if (errorMessage == "") {

alert("Success!");

} else {

$("#error").html(errorMessage);

}
});

</script>

</body>


</html>
